<!DOCTYPE html>
<html lang="es" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador | Bebidas 25 de Mayo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#B81414',
                            redDark: '#8F0E0E',
                            gold: '#F5C518',
                            goldDark: '#D4A60D',
                            dark: '#0A0A0A',
                            panel: '#141414'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .font-brand { font-family: 'Bebas Neue', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-b from-neutral-950 via-black to-neutral-950 text-slate-100 selection:bg-brand-red selection:text-white">

    <div class="w-full max-w-md">
        <!-- Logo y Cabecera de Marca -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full border-2 border-brand-gold bg-black shadow-2xl p-1 mb-3">
                <img src="/static/images/logo.png" onerror="this.src='/uploads/logo.jpg'" alt="Bebidas 25 de Mayo" class="w-full h-full object-cover rounded-full">
            </div>
            <h1 class="text-3xl font-brand tracking-wider text-white uppercase">BEBIDAS <span class="text-brand-gold">25 DE MAYO</span></h1>
            <p class="text-xs text-brand-gold font-medium uppercase tracking-widest mt-0.5">Control de Inventario & Administración</p>
        </div>

        <!-- Tarjeta de Login -->
        <div class="bg-neutral-900/90 border border-neutral-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md relative overflow-hidden">
            <!-- Barra decorativa superior -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-brand-red via-brand-gold to-brand-red"></div>

            <div class="flex items-center space-x-2 text-slate-300 text-sm font-bold mb-4">
                <i class="fa-solid fa-shield-halved text-brand-gold text-base"></i>
                <span>Acceso Restringido a Personal</span>
            </div>

            <!-- Alerta de Error -->
            {% if error %}
            <div class="mb-5 bg-rose-950/80 border border-rose-800 text-rose-200 text-xs px-4 py-3 rounded-xl flex items-center space-x-2.5">
                <i class="fa-solid fa-circle-exclamation text-rose-400 text-base flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" class="space-y-4">
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wide">
                        Contraseña de Administrador
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input 
                            type="password" 
                            name="password" 
                            id="password" 
                            required 
                            autofocus 
                            placeholder="Ingresá tu clave de acceso..."
                            class="w-full bg-black border border-neutral-700 text-white rounded-xl pl-10 pr-11 py-3 text-sm focus:outline-none focus:border-brand-gold focus:ring-1 focus:ring-brand-gold transition-all"
                        >
                        <button 
                            type="button" 
                            id="togglePasswordBtn"
                            onclick="togglePasswordVisibility()" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition-colors"
                            aria-label="Ver u ocultar contraseña"
                        >
                            <i id="toggleEyeIcon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-brand-gold hover:bg-brand-goldDark text-slate-950 font-black py-3 rounded-xl text-sm tracking-wide uppercase transition-all shadow-lg hover:shadow-brand-gold/20 flex items-center justify-center space-x-2 active:scale-[0.99]"
                >
                    <span>Ingresar al Panel de Stock</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-neutral-800 text-center">
                <a href="/tienda" class="text-xs text-slate-400 hover:text-brand-gold transition-colors inline-flex items-center space-x-1.5">
                    <i class="fa-solid fa-store"></i>
                    <span>Volver a la Tienda de Clientes</span>
                </a>
            </div>
        </div>

        <p class="text-center text-[11px] text-neutral-600 mt-6">
            © 2026 Bebidas 25 de Mayo · Lanús Oeste · Todos los derechos reservados.
        </p>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('toggleEyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
